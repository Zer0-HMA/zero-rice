# hypridle — bloqueo automático (zero-rice)
# El instalador solo lo copia si no tenías uno. Cambia los tiempos a tu gusto (en segundos).

general {
    lock_cmd = pidof hyprlock || hyprlock      # lo que hace "loginctl lock-session"
    before_sleep_cmd = loginctl lock-session   # bloquea antes de suspender
}

# Bloquear después de 10 minutos sin usar la compu
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Suspender después de 30 minutos (quítale los # para activarlo)
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
