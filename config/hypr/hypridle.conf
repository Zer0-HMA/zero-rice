# hypridle — bloqueo automático (zero-rice)
# El instalador solo lo copia si no tenías uno propio. Cambia los tiempos a tu gusto (en segundos).
# Después de editarlo:  pkill -x hypridle; hypridle & disown

general {
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/zero-lock.sh lock   # lo que hace "loginctl lock-session"
    before_sleep_cmd = loginctl lock-session                                 # bloquea antes de suspender
    ignore_dbus_inhibit = false                                              # videos y llamadas evitan el bloqueo
}

# Bloquear después de 10 minutos sin usar la compu
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Suspender después de 30 minutos (quítale los # para activarlo)
# listener {
