name: Revisar

on:
  push:
  pull_request:

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxis de bash
        run: for f in install.sh config/hypr/scripts/*.sh config/hypr/scripts/lib/*.sh; do bash -n "$f"; done

      - name: ShellCheck
        run: shellcheck -S warning install.sh config/hypr/scripts/*.sh config/hypr/scripts/lib/*.sh .github/pruebas/*.sh

      - name: Scripts ejecutables
        run: |
          for f in install.sh config/hypr/scripts/*.sh; do
            [[ -x "$f" ]] || { echo "Falta el permiso de ejecución: $f  (git update-index --chmod=+x $f)"; exit 1; }
          done

      - name: zero-lock genera sus 5 estilos sin colgarse
        run: |
          export HOME=$(mktemp -d) ZL_TTY=1
          for e in tarjetas minimal centrado terminal panel; do
            bash config/hypr/scripts/zero-lock.sh estilo "$e" >/dev/null
            timeout 15 bash config/hypr/scripts/zero-lock.sh gen > "/tmp/zl-$e.conf" || { echo "zero-lock se colgó o falló con el estilo $e"; exit 1; }
            grep -q '^input-field {' "/tmp/zl-$e.conf" || { echo "Estilo $e sin campo de contraseña"; exit 1; }
          done

      - name: zero-lock bloquea aunque hyprlock se cuelgue o se caiga (bug de hyprlock 0.9.6)
        run: bash .github/pruebas/zero-lock-bloqueo.sh

      - name: Fondos en video (wall.sh con awww, mpvpaper y ffmpeg simulados)
        run: bash .github/pruebas/fondos-video.sh

      - name: Sintaxis de Lua
        run: |
          sudo apt-get install -y -qq lua5.4 >/dev/null
          luac5.4 -p config/hypr/rice.lua
          find config/nvim -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p

      - name: Estilos de la barra completos
        run: |
          for id in $(grep -oE '^  "[a-z]+\|' config/hypr/scripts/barra-estilo.sh | tr -d ' "|'); do
            [[ -f "config/ags/estilos/$id.css" ]] || { echo "Falta config/ags/estilos/$id.css"; exit 1; }
          done

      - name: Sintaxis de la barra (TypeScript)
        run: npx --yes esbuild@0.24.0 config/ags/*.tsx config/ags/*.ts --loader:.tsx=tsx --jsx=preserve --log-level=error --outdir=/tmp/revision

      - name: JSON de SwayNC
        run: jq empty config/swaync/config.json

      - name: Paletas bien escritas
        run: |
          grep -vE '^[[:space:]]*(#|$)' config/rice-paletas/paletas.txt | while IFS='|' read -r id _ _ _ c1 c2 c3 c4 c5 c6 c7 c8; do
            for c in $c1 $c2 $c3 $c4 $c5 $c6 $c7 $c8; do
              [[ "$c" =~ ^#[0-9a-fA-F]{6}$ ]] || { echo "Paleta '$id': color inválido '$c'"; exit 1; }
            done
          done
